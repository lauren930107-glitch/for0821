<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頒獎配置台</title>
<style>
  :root{
    --bg: #12141A;
    --bg-raised: #1B1E27;
    --bg-raised-2: #22262F;
    --line: #2E3340;
    --amber: #F2A93B;
    --teal: #4FD1C5;
    --rose: #E8697D;
    --text: #EDEEF2;
    --text-faint: #5D6270;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif;
    --display: 'Arial Black', 'PingFang TC', var(--sans);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:24px 16px 40px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .input-box{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
  }
  .input-box label{
    display:block;
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:10px;
  }
  .input-row{ display:flex; gap:10px; }
  .input-row input{
    flex:1;
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:16px;
    padding:13px 14px;
    border-radius:10px;
  }
  .input-row input:focus{outline:none; border-color:var(--amber);}
  .input-row button{
    background:var(--amber);
    color:#1a1300;
    font-weight:900;
    border:none;
    padding:0 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .error{ color:var(--rose); font-size:12px; margin-top:8px; }

  .order-strip{
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .order-chip{
    font-family:var(--display);
    font-weight:900;
    font-size:13px;
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text-faint);
    padding:6px 12px;
    border-radius:99px;
  }
  .order-chip .n{ color:var(--amber); margin-right:4px; }
  .order-chip.champ{ color:var(--amber); border-color:var(--amber); }

  .seq-wrap{margin-top:16px;}
  .seq-round{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:10px;
  }
  .seq-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
  }
  .seq-num{
    font-family:var(--display);
    font-weight:900;
    font-size:16px;
    color:var(--amber);
  }
  .seq-rank{
    font-size:11px;
    color:var(--text-faint);
  }
  .seq-team{ display:flex; gap:14px; }
  .seq-team-block{ flex:1; }
  .seq-team-label{ font-size:11px; font-weight:900; margin-bottom:6px; }
  .seq-team-label.a{ color:var(--teal); }
  .seq-team-label.b{ color:#C9A6F2; }
  .seq-item{ font-size:13px; color:var(--text); margin-bottom:3px; }
  .seq-item .rl{ color:var(--text-faint); margin-right:4px; }
  .tag{
    display:inline-block;
    font-size:9px;
    padding:2px 7px;
    border-radius:99px;
    margin-left:6px;
    vertical-align:middle;
    background:rgba(242,169,59,0.16);
    color:var(--amber);
    border:1px solid rgba(242,169,59,0.45);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="input-box">
    <label>依名次輸入組別(第1名→最後一名),用逗號分隔,例如:3,7,1,9,5,2,8,4,6</label>
    <div class="input-row">
      <input id="rankInput" type="text" placeholder="3,7,1,9,5,2,8,4,6">
      <button id="genBtn">產生</button>
    </div>
    <div class="error" id="err"></div>
  </div>

  <div id="orderStrip" class="order-strip"></div>
  <div class="seq-wrap" id="seqWrap"></div>
</div>

<script>
const people = {
  Harris: { team:'A', group:7, role:'tray',    label:'拿托盤' },
  Lauren: { team:'A', group:2, role:'present', label:'遞獎'   },
  Selina: { team:'A', group:4, role:'backup',  label:'後勤'   },
  Penny:  { team:'B', group:7, role:'tray',    label:'拿托盤' },
  Libby:  { team:'B', group:1, role:'present', label:'遞獎'   },
  Jaen:   { team:'B', group:8, role:'backup',  label:'後勤'   },
};
const ROLE_ORDER = ['tray','present','backup'];
const ROLE_LABEL = { tray:'拿托盤', present:'遞獎', backup:'後勤' };

/* 每次只有一組上台,A、B 兩隊同時一起服務,不能跨隊支援。
   缺人時:自己隊伍後勤優先補;後勤也不在,看隊上還有沒有其他沒被拉走的人可以兼；
   真的整隊都被拉走,拿托盤才由 Jane(僅限A隊)支援,遞獎沒人補就顯示沒人。 */
/* 只看「當下這組」有沒有撞到自己組別,撞到才迴避;不管前一輪是誰。
   自己隊伍後勤補自己隊伍的缺;後勤也撞到,看隊上還有沒有人能兼;
   真的沒人,拿托盤才由 Jane(僅限A隊)頂上,遞獎沒人就沒人。 */
function computeTeam(team, g){
  const trayName = team === 'A' ? 'Harris' : 'Penny';
  const presentName = team === 'A' ? 'Lauren' : 'Libby';
  const backupName = team === 'A' ? 'Selina' : 'Jaen';

  const hardTray = people[trayName].group === g;
  const hardPresent = people[presentName].group === g;
  const hardBackup = people[backupName].group === g;

  const slots = {
    tray:    { original: trayName,    current: trayName,    status: 'normal' },
    present: { original: presentName, current: presentName, status: 'normal' },
    backup:  { original: backupName,  current: backupName,  status: hardBackup ? 'vacant' : 'normal' },
  };

  let backupUsed = hardBackup;

  if (hardPresent){
    if (!backupUsed){
      slots.present = { original: presentName, current: backupName, status: 'filled', via: 'own' };
      backupUsed = true;
      slots.backup = { original: backupName, current: backupName, status: 'lending' };
    } else {
      slots.present = { original: presentName, current: null, status: 'pending' };
    }
  }
  if (hardTray){
    if (!backupUsed){
      slots.tray = { original: trayName, current: backupName, status: 'filled', via: 'own' };
      backupUsed = true;
      slots.backup = { original: backupName, current: backupName, status: 'lending' };
    } else {
      slots.tray = { original: trayName, current: null, status: 'pending' };
    }
  }

  const holderOf = (slot) => (slot.status === 'normal' || slot.status === 'filled') ? slot.current : null;

  if (slots.tray.status === 'pending'){
    const helper = holderOf(slots.present);
    if (helper){
      slots.tray = { original: slots.tray.original, current: helper, status: 'filled', via: 'double' };
    } else if (team === 'A'){
      slots.tray = { original: slots.tray.original, current: 'Jane', status: 'filled', via: 'jane' };
    } else {
      slots.tray = { original: slots.tray.original, current: null, status: 'unresolved' };
    }
  }

  if (slots.present.status === 'pending'){
    const helper = holderOf(slots.tray);
    if (helper){
      slots.present = { original: slots.present.original, current: helper, status: 'filled', via: 'double' };
    } else {
      slots.present = { original: slots.present.original, current: null, status: 'unresolved' };
    }
  }

  return slots;
}

function computeSchedule(order){
  return order.map(g => ({
    g,
    boardA: computeTeam('A', g),
    boardB: computeTeam('B', g),
  }));
}

function activeNames(board){
  const names = [];
  for (const role of ['tray','present','backup']){
    const s = board[role];
    if ((s.status === 'normal' || s.status === 'filled') && !names.includes(s.current)){
      names.push(s.current);
    }
    if (s.via === 'jane' && !names.includes('Jane')){
      names.push('Jane');
    }
  }
  return names;
}

function parseRankInput(text){
  const parts = text.split(/[,、\s]+/).map(s=>s.trim()).filter(s=>s.length>0);
  const nums = [];
  for (const p of parts){
    const n = parseInt(p, 10);
    if (isNaN(n) || n < 1 || n > 9 || String(n) !== p) return null;
    nums.push(n);
  }
  return nums.length ? nums : null;
}

const rankInput = document.getElementById('rankInput');
const genBtn = document.getElementById('genBtn');
const errEl = document.getElementById('err');
const orderStrip = document.getElementById('orderStrip');
const seqWrap = document.getElementById('seqWrap');

function render(){
  const ranked = parseRankInput(rankInput.value); // 第1名 → 最後一名
  if (!ranked){
    errEl.textContent = '請輸入 1~9 的組別數字,用逗號分隔,依名次由高到低排列';
    orderStrip.innerHTML = '';
    seqWrap.innerHTML = '';
    return;
  }
  errEl.textContent = '';

  const announceOrder = [...ranked].reverse(); // 倒序公布:最後一名先頒,冠軍壓軸

  orderStrip.innerHTML = announceOrder.map((g, i) => {
    const isChamp = i === announceOrder.length - 1;
    return `<span class="order-chip${isChamp?' champ':''}"><span class="n">${i+1}</span>第${g}組</span>`;
  }).join('');

  const schedule = computeSchedule(announceOrder);
  let html = '';
  schedule.forEach((round, idx) => {
    const aNames = activeNames(round.boardA).join('、');
    const bNames = activeNames(round.boardB).join('、');
    html += `
      <div class="seq-round">
        <div class="seq-head"><span class="seq-num">第 ${idx+1} 棒 · 第 ${round.g} 組</span></div>
        <div class="seq-team">
          <div class="seq-team-block">
            <div class="seq-team-label a">A隊</div>
            <div class="seq-item">${aNames}</div>
          </div>
          <div class="seq-team-block">
            <div class="seq-team-label b">B隊</div>
            <div class="seq-item">${bNames}</div>
          </div>
        </div>
      </div>`;
  });
  seqWrap.innerHTML = html;
}

genBtn.addEventListener('click', render);
rankInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') render(); });
</script>
</body>
</html>
