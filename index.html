<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頒獎配置台</title>
<style>
  :root{
    --bg: #12141A;
    --bg-raised: #1B1E27;
    --bg-raised-2: #22262F;
    --line: #2E3340;
    --amber: #F2A93B;
    --amber-dim: #8A6425;
    --teal: #4FD1C5;
    --rose: #E8697D;
    --text: #EDEEF2;
    --text-faint: #5D6270;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif;
    --display: 'Arial Black', 'PingFang TC', var(--sans);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:24px 16px 40px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .deck{display:flex;justify-content:center;}
  .field{width:220px;}
  select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--display);
    font-weight:900;
    font-size:24px;
    text-align:center;
    padding:16px;
    border-radius:12px;
    cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position: calc(100% - 22px) calc(1.15em), calc(100% - 16px) calc(1.15em);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  select:focus{outline:none; border-color:var(--amber);}

  .results{margin-top:20px;}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }

  .team-card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px 18px;
  }
  .team-name{
    font-family:var(--display);
    font-weight:900;
    font-size:14px;
    padding-top:14px;
  }
  .team-name.a{color:var(--teal);}
  .team-name.b{color:#C9A6F2;}

  .role-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-top:1px solid var(--line);
    gap:10px;
  }
  .role-label{
    font-size:12px;
    color:var(--text-faint);
    flex:0 0 auto;
  }
  .role-occupant{
    flex:1;
    text-align:right;
  }
  .name-current{
    font-family:var(--display);
    font-weight:900;
    font-size:19px;
    color:var(--text);
  }
  .name-out{
    font-size:12px;
    color:var(--text-faint);
    text-decoration:line-through;
    margin-right:6px;
  }
  .arrow{color:var(--text-faint); margin:0 4px; font-size:12px;}

  .tag{
    display:inline-block;
    font-size:10px;
    padding:3px 8px;
    border-radius:99px;
    margin-left:8px;
    vertical-align:middle;
    background:rgba(242,169,59,0.16);
    color:var(--amber);
    border:1px solid rgba(242,169,59,0.45);
  }

  .mode-toggle{
    display:flex;
    justify-content:center;
    margin-top:18px;
  }
  .mode-btn{
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text-faint);
    font-size:13px;
    padding:9px 18px;
    border-radius:99px;
    cursor:pointer;
  }
  .mode-btn:hover{ color:var(--text); border-color:var(--amber-dim); }

  .seq-wrap{margin-top:16px;}
  .seq-round{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:10px;
  }
  .seq-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
  }
  .seq-num{
    font-family:var(--display);
    font-weight:900;
    font-size:16px;
    color:var(--amber);
  }
  .seq-team{
    display:flex;
    gap:14px;
  }
  .seq-team-block{ flex:1; }
  .seq-team-label{
    font-size:11px;
    font-weight:900;
    margin-bottom:6px;
  }
  .seq-team-label.a{ color:var(--teal); }
  .seq-team-label.b{ color:#C9A6F2; }
  .seq-item{
    font-size:13px;
    color:var(--text);
    margin-bottom:3px;
  }
  .order-box{
    margin-top:18px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .order-box label{
    display:block;
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .order-row{
    display:flex;
    gap:10px;
  }
  .order-row input{
    flex:1;
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:16px;
    padding:12px 14px;
    border-radius:10px;
  }
  .order-row input:focus{outline:none; border-color:var(--amber);}
  .order-row button{
    background:var(--amber);
    color:#1a1300;
    font-weight:900;
    border:none;
    padding:0 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .order-error{
    color:var(--rose);
    font-size:12px;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="deck">
    <div class="field"><select id="g1"></select></div>
  </div>

  <div class="results" id="results"></div>

  <div class="order-box">
    <label>輸入頒獎順序(用逗號分隔組別,例如:3,1,5,2,4,7,6,8,9)</label>
    <div class="order-row">
      <input id="orderInput" type="text" placeholder="3,1,5,2,4,7,6,8,9">
      <button id="orderBtn">產生排班</button>
    </div>
    <div class="order-error" id="orderError"></div>
  </div>
  <div class="seq-wrap" id="seqWrap"></div>
</div>

<script>
const people = {
  Harris: { team:'A', group:7, role:'tray',    label:'拿托盤' },
  Lauren: { team:'A', group:2, role:'present', label:'遞獎'   },
  Selina: { team:'A', group:4, role:'backup',  label:'後勤'   },
  Penny:  { team:'B', group:7, role:'tray',    label:'拿托盤' },
  Libby:  { team:'B', group:1, role:'present', label:'遞獎'   },
  Jaen:   { team:'B', group:8, role:'backup',  label:'後勤'   },
};
const ROLE_ORDER = ['tray','present','backup'];
const ROLE_LABEL = { tray:'拿托盤', present:'遞獎', backup:'後勤' };

const g1Sel = document.getElementById('g1');
const resultsEl = document.getElementById('results');

for (let i=1;i<=9;i++){
  const o1 = document.createElement('option'); o1.value=i; o1.textContent = '第 '+i+' 組';
  g1Sel.appendChild(o1);
}
g1Sel.value = 1;

/* 每次只有一組上台,但 A、B 兩隊同時一起服務這一組,且不能跨隊支援——
   只能用自己隊伍的後勤補自己隊伍的缺,後勤真的也不在時,拿托盤才由 Jane 支援,
   遞獎沒人補則誠實顯示未解決。 */
function computeTeam(team, g, restingSet){
  restingSet = restingSet || new Set();
  const trayName = team === 'A' ? 'Harris' : 'Penny';
  const presentName = team === 'A' ? 'Lauren' : 'Libby';
  const backupName = team === 'A' ? 'Selina' : 'Jaen';

  const needsOut = (name) => people[name].group === g || restingSet.has(name);
  const backupFree = !needsOut(backupName);

  const slots = {};
  slots.backup = needsOut(backupName)
    ? { original: backupName, current: backupName, status: 'vacant' }
    : { original: backupName, current: backupName, status: 'normal' };

  let backupUsed = false;

  // 遞獎優先(Jane 不能補遞獎)
  if (needsOut(presentName)){
    if (backupFree && !backupUsed){
      slots.present = { original: presentName, current: backupName, status: 'filled', via: 'own' };
      backupUsed = true;
      slots.backup = { original: backupName, current: backupName, status: 'lending' };
    } else {
      slots.present = { original: presentName, current: null, status: 'unresolved' };
    }
  } else {
    slots.present = { original: presentName, current: presentName, status: 'normal' };
  }

  if (needsOut(trayName)){
    if (backupFree && !backupUsed){
      slots.tray = { original: trayName, current: backupName, status: 'filled', via: 'own' };
      backupUsed = true;
      slots.backup = { original: backupName, current: backupName, status: 'lending' };
    } else {
      slots.tray = { original: trayName, current: 'Jane', status: 'filled', via: 'jane' };
    }
  } else {
    slots.tray = { original: trayName, current: trayName, status: 'normal' };
  }

  return slots;
}

function render(){
  const g1 = parseInt(g1Sel.value, 10);

  const boardA = computeTeam('A', g1);
  const boardB = computeTeam('B', g1);
  const board = { A: boardA, B: boardB };

  function occupantHtml(slot){
    const tag = slot.via === 'jane' ? '<span class="tag">面試組支援</span>' : '';
    const away = slot.status === 'vacant' || slot.status === 'lending' || slot.status === 'unresolved';
    const name = away ? '－' : slot.current;
    return `<span class="name-current">${name}</span>${tag}`;
  }

  function teamCard(team, teamLabel, cls){
    let rows = '';
    for (const role of ROLE_ORDER){
      rows += `
        <div class="role-row">
          <div class="role-label">${ROLE_LABEL[role]}</div>
          <div class="role-occupant">${occupantHtml(board[team][role])}</div>
        </div>`;
    }
    return `
      <div class="team-card">
        <div class="team-name ${cls}">${teamLabel}</div>
        ${rows}
      </div>`;
  }

  resultsEl.innerHTML = `
    <div class="grid">
      ${teamCard('A','A 隊','a')}
      ${teamCard('B','B 隊','b')}
    </div>`;
}

g1Sel.addEventListener('change', render);
render();

/* ---------- 依序 1→9 組完整排班(循環模式) ---------- */

function computeSequentialSchedule(order){
  let resting = new Set();
  const schedule = [];

  for (const g of order){
    const boardA = computeTeam('A', g, resting);
    const boardB = computeTeam('B', g, resting);

    const recipients = Object.keys(people).filter(n => people[n].group === g);
    schedule.push({ g, boardA, boardB, recipients });

    resting = new Set(recipients.filter(n => people[n].role === 'tray' || people[n].role === 'present'));
  }
  return schedule;
}

function seqItemHtml(slot){
  const label = ROLE_LABEL[slot.__role];
  const away = slot.status === 'vacant' || slot.status === 'lending' || slot.status === 'unresolved';
  const name = away ? '－' : slot.current;
  const tag = slot.via === 'jane' ? ' <span class="tag" style="font-size:9px;">面試組支援</span>' : '';
  return `<div class="seq-item"><span class="rl">${label}</span>${name}${tag}</div>`;
}

function renderSequential(order){
  const schedule = computeSequentialSchedule(order);
  let html = '';
  schedule.forEach((round, idx) => {
    let aItems = '', bItems = '';
    for (const role of ROLE_ORDER){
      round.boardA[role].__role = role;
      round.boardB[role].__role = role;
      aItems += seqItemHtml(round.boardA[role]);
      bItems += seqItemHtml(round.boardB[role]);
    }
    html += `
      <div class="seq-round">
        <div class="seq-head"><span class="seq-num">第 ${idx+1} 棒 · 第 ${round.g} 組</span></div>
        <div class="seq-team">
          <div class="seq-team-block">
            <div class="seq-team-label a">A隊</div>
            ${aItems}
          </div>
          <div class="seq-team-block">
            <div class="seq-team-label b">B隊</div>
            ${bItems}
          </div>
        </div>
      </div>`;
  });
  seqWrap.innerHTML = html;
}

const orderInput = document.getElementById('orderInput');
const orderBtn = document.getElementById('orderBtn');
const orderError = document.getElementById('orderError');
const seqWrap = document.getElementById('seqWrap');

function parseOrder(text){
  const parts = text.split(/[,、\s]+/).map(s=>s.trim()).filter(s=>s.length>0);
  const nums = [];
  for (const p of parts){
    const n = parseInt(p, 10);
    if (isNaN(n) || n < 1 || n > 9 || String(n) !== p) return null;
    nums.push(n);
  }
  return nums.length ? nums : null;
}

orderBtn.addEventListener('click', () => {
  const order = parseOrder(orderInput.value);
  if (!order){
    orderError.textContent = '請輸入 1~9 的組別數字,用逗號分隔';
    seqWrap.innerHTML = '';
    return;
  }
  orderError.textContent = '';
  renderSequential(order);
});

orderInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') orderBtn.click();
});
</script>
</body>
</html>
