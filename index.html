<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頒獎配置台</title>
<style>
  :root{
    --bg: #12141A;
    --bg-raised: #1B1E27;
    --bg-raised-2: #22262F;
    --line: #2E3340;
    --amber: #F2A93B;
    --teal: #4FD1C5;
    --rose: #E8697D;
    --text: #EDEEF2;
    --text-faint: #5D6270;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif;
    --display: 'Arial Black', 'PingFang TC', var(--sans);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:24px 16px 40px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .deck{
    display:flex;
    gap:14px;
    align-items:center;
  }
  .field{flex:1;}
  select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    background:var(--bg-raised-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--display);
    font-weight:900;
    font-size:24px;
    text-align:center;
    padding:16px;
    border-radius:12px;
    cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position: calc(100% - 22px) calc(1.15em), calc(100% - 16px) calc(1.15em);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  select:focus{outline:none; border-color:var(--amber);}
  .vs{
    font-family:var(--display);
    color:var(--text-faint);
    font-size:16px;
    flex:0 0 auto;
  }

  .results{margin-top:20px;}
  .same-warning{
    background:rgba(232,105,125,0.08);
    border:1px solid rgba(232,105,125,0.35);
    color:#F1AAB6;
    border-radius:12px;
    padding:16px 18px;
    font-size:14px;
    text-align:center;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }

  .team-card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px 18px;
  }
  .team-name{
    font-family:var(--display);
    font-weight:900;
    font-size:14px;
    padding-top:14px;
  }
  .team-name.a{color:var(--teal);}
  .team-name.b{color:#C9A6F2;}

  .role-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-top:1px solid var(--line);
    gap:10px;
  }
  .role-label{
    font-size:12px;
    color:var(--text-faint);
    flex:0 0 auto;
  }
  .role-occupant{
    flex:1;
    text-align:right;
  }
  .name-current{
    font-family:var(--display);
    font-weight:900;
    font-size:19px;
    color:var(--text);
  }
  .name-out{
    font-size:12px;
    color:var(--text-faint);
    text-decoration:line-through;
    margin-right:6px;
  }
  .arrow{color:var(--text-faint); margin:0 4px; font-size:12px;}

  .tag{
    display:inline-block;
    font-size:10px;
    padding:3px 8px;
    border-radius:99px;
    margin-left:8px;
    vertical-align:middle;
    background:rgba(242,169,59,0.16);
    color:var(--amber);
    border:1px solid rgba(242,169,59,0.45);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="deck">
    <div class="field"><select id="g1"></select></div>
    <div class="vs">×</div>
    <div class="field"><select id="g2"></select></div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
const people = {
  Harris: { team:'A', group:7, role:'tray',    label:'拿托盤' },
  Lauren: { team:'A', group:2, role:'present', label:'遞獎'   },
  Selina: { team:'A', group:4, role:'backup',  label:'後勤'   },
  Penny:  { team:'B', group:7, role:'tray',    label:'拿托盤' },
  Libby:  { team:'B', group:1, role:'present', label:'遞獎'   },
  Jaen:   { team:'B', group:8, role:'backup',  label:'後勤'   },
};
const ROLE_ORDER = ['tray','present','backup'];
const ROLE_LABEL = { tray:'拿托盤', present:'遞獎', backup:'後勤' };

const g1Sel = document.getElementById('g1');
const g2Sel = document.getElementById('g2');
const resultsEl = document.getElementById('results');

for (let i=1;i<=9;i++){
  const o1 = document.createElement('option'); o1.value=i; o1.textContent = '第 '+i+' 組';
  g1Sel.appendChild(o1);
}
const blankOpt = document.createElement('option');
blankOpt.value = '';
blankOpt.textContent = '（單獨頒獎）';
g2Sel.appendChild(blankOpt);
for (let i=1;i<=9;i++){
  const o2 = document.createElement('option'); o2.value=i; o2.textContent = '第 '+i+' 組';
  g2Sel.appendChild(o2);
}
g1Sel.value = 1;
g2Sel.value = '';

function computeAssignment(g1, g2){
  const onstage = g2 !== null ? new Set([g1, g2]) : new Set([g1]);
  const vacantNames = Object.keys(people).filter(n => onstage.has(people[n].group));
  const needFill = vacantNames.filter(n => people[n].role !== 'backup');

  let subsPool = ['Selina','Jaen'].filter(n => !onstage.has(people[n].group));

  const board = { A:{}, B:{} };
  for (const team of ['A','B']){
    for (const role of ROLE_ORDER){
      const originalName = Object.keys(people).find(n => people[n].team===team && people[n].role===role);
      const isVacant = onstage.has(people[originalName].group);
      board[team][role] = { original: originalName, current: originalName, status: isVacant ? 'vacant' : 'normal', via: null };
    }
  }

  const pending = [];

  // 遞獎只能靠後勤補(Jane 不支援遞獎),所以優先處理遞獎缺口,
  // 拿托盤的缺口留到最後,因為拿托盤還有 Jane 這個備援。
  const presentNeeds = needFill.filter(n => people[n].role === 'present');
  const trayNeeds = needFill.filter(n => people[n].role === 'tray');
  const orderedNeeds = [...presentNeeds, ...trayNeeds];

  for (const name of orderedNeeds){
    const p = people[name];
    const ownBackup = p.team === 'A' ? 'Selina' : 'Jaen';
    if (subsPool.includes(ownBackup)){
      board[p.team][p.role].current = ownBackup;
      board[p.team][p.role].status = 'filled';
      board[p.team][p.role].via = 'own';
      subsPool = subsPool.filter(x=>x!==ownBackup);
    } else {
      pending.push(name);
    }
  }

  for (const name of pending.filter(n=>people[n].role==='present').concat(pending.filter(n=>people[n].role==='tray'))){
    const p = people[name];
    const otherBackup = p.team === 'A' ? 'Jaen' : 'Selina';
    if (subsPool.includes(otherBackup)){
      board[p.team][p.role].current = otherBackup;
      board[p.team][p.role].status = 'filled';
      board[p.team][p.role].via = 'cross';
      subsPool = subsPool.filter(x=>x!==otherBackup);
    } else if (p.role === 'tray'){
      // 面試組 Jane 只支援拿托盤,不支援遞獎
      board[p.team][p.role].current = 'Jane';
      board[p.team][p.role].status = 'filled';
      board[p.team][p.role].via = 'jane';
    } else {
      // 遞獎缺人時 Jane 不支援,維持原樣標示未解決
      board[p.team][p.role].status = 'unresolved';
      board[p.team][p.role].via = 'unresolved';
    }
  }

  for (const team of ['A','B']){
    const backupSlot = board[team]['backup'];
    if (backupSlot.status === 'vacant'){
      const stillActive = Object.keys(people).find(n =>
        people[n].team === team && people[n].role !== 'backup' && board[team][people[n].role].status === 'normal'
      );
      if (stillActive){
        backupSlot.current = stillActive;
        backupSlot.status = 'filled';
        backupSlot.via = 'own';
      }
    }
  }

  const availableBackups = ['Selina','Jaen'].filter(n => !onstage.has(people[n].group));
  if (availableBackups.length === 0){
    for (const team of ['A','B']){
      const slot = board[team]['backup'];
      if (slot.status === 'vacant'){
        slot.current = 'Jane';
        slot.status = 'filled';
        slot.via = 'jane';
      }
    }
  }

  return { board };
}

function render(){
  const g1 = parseInt(g1Sel.value, 10);
  const g2raw = g2Sel.value;
  const g2 = g2raw === '' ? null : parseInt(g2raw, 10);

  if (g2 !== null && g1 === g2){
    resultsEl.innerHTML = '<div class="same-warning">請選擇兩個不同的組別</div>';
    return;
  }

  const { board } = computeAssignment(g1, g2);

  function teamCard(team, teamLabel, cls){
    let rows = '';
    for (const role of ROLE_ORDER){
      const slot = board[team][role];
      let occupantHtml = '';
      if (slot.status === 'normal'){
        occupantHtml = `<span class="name-current">${slot.current}</span>`;
      } else if (slot.status === 'vacant'){
        occupantHtml = `<span class="name-out">${slot.original}</span><span class="arrow">迴避</span>`;
      } else if (slot.status === 'unresolved'){
        occupantHtml = `<span class="name-out">${slot.original}</span><span class="arrow">迴避,尚無人可補</span>`;
      } else {
        const tag = slot.via === 'jane' ? '<span class="tag">面試組支援</span>' : '';
        occupantHtml = `<span class="name-out">${slot.original}</span><span class="arrow">→</span><span class="name-current">${slot.current}</span>${tag}`;
      }
      rows += `
        <div class="role-row">
          <div class="role-label">${ROLE_LABEL[role]}</div>
          <div class="role-occupant">${occupantHtml}</div>
        </div>`;
    }
    return `
      <div class="team-card">
        <div class="team-name ${cls}">${teamLabel}</div>
        ${rows}
      </div>`;
  }

  if (g2 === null){
    // 單獨頒獎:只有一組上台,挑一隊去負責,優先挑完全沒人異動的那隊
    const onstage = new Set([g1]);
    const conflictA = Object.keys(people).some(n => people[n].team==='A' && people[n].group===g1);
    const conflictB = Object.keys(people).some(n => people[n].team==='B' && people[n].group===g1);
    const chosen = !conflictA ? 'A' : (!conflictB ? 'B' : 'B');
    const label = chosen === 'A' ? 'A 隊' : 'B 隊';
    const cls = chosen === 'A' ? 'a' : 'b';
    resultsEl.innerHTML = `<div class="grid" style="grid-template-columns:1fr;max-width:360px;margin:0 auto;">${teamCard(chosen, label, cls)}</div>`;
    return;
  }

  resultsEl.innerHTML = `
    <div class="grid">
      ${teamCard('A','A 隊','a')}
      ${teamCard('B','B 隊','b')}
    </div>`;
}

g1Sel.addEventListener('change', render);
g2Sel.addEventListener('change', render);
render();
</script>
</body>
</html>
